[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "kilim-tui"
version = "0.4.31"
description = "Kilim multi-view terminal: Rust core + ratatui TUI + Lace Qt surface"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8.0", "maturin>=1.8", "ruff>=0.6", "stitch-pty>=0.5.6"]  # wheel = dev reference only (examples), never a runtime dep
qt = ["PySide6", "qframelesswindow", "lace-dock>=0.7.6"]  # no wheels at runtime: terms via kilim._core, preview via Rust mordant

[tool.maturin]
# Every wheel ships pure-Rust mordant preview (KaTeX/mermaid included).
# Unambiguous package/feature syntax: bare `--features` proved unreliable
# through maturin (built .pyd silently lacked the symbols).
features = ["pyo3/extension-module", "python", "kilim-py/markdown"]
python-source = "python"
module-name = "kilim._core"
manifest-path = "crates/kilim-py/Cargo.toml"

[tool.ruff]
line-length = 100
target-version = "py312"
