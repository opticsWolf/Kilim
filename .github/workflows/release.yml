# Kilim release: wheels + TUI binaries, with mordant wheel themes pulled
# from GitHub at build time (never vendored — see
# crates/kilim-core/assets/ATTRIBUTION.md).
#
# The themes rev lives in exactly one place: DEFAULT_REV in
# crates/kilim-core/build.rs. The fetch step below reads it from there,
# so bumping mordant needs no workflow edit. Both the maturin wheels and
# the cargo TUI binary build with MORDANT_THEMES_DIR set; without it the
# build still succeeds but ships fewer themes (build.rs warns loudly).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  MORDANT_REPO: opticsWolf/mordant

jobs:
  # ── Shared: fetch + export (duplicated per job; runners are isolated) ──
  # Each build job starts with these two steps (anchor-free on purpose:
  # explicit is better than YAML-anchor magic across jobs).

  build-wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch mordant wheel themes
        shell: bash
        run: |
          REV=$(grep -oP 'DEFAULT_REV: &str = "\K[^"]+' crates/kilim-core/build.rs)
          echo "Mordant themes rev: $REV"
          mkdir -p "${RUNNER_TEMP}/mordant-src"
          curl -sSL --fail -o "${RUNNER_TEMP}/mordant.tgz" \
            "https://codeload.github.com/${MORDANT_REPO}/tar.gz/refs/tags/${REV}"
          tar -xzf "${RUNNER_TEMP}/mordant.tgz" -C "${RUNNER_TEMP}/mordant-src"
          THEMES_DIR=$(find "${RUNNER_TEMP}/mordant-src" -type d -path "*mordant-py/mordant/themes" | head -n 1)
          test -n "$THEMES_DIR" || { echo "themes dir not found in tarball"; exit 1; }
          COUNT=$(ls "$THEMES_DIR" | wc -l)
          echo "Fetched $COUNT theme files from ${MORDANT_REPO}@${REV}"
          test "$COUNT" -ge 50 || { echo "suspiciously few themes"; exit 1; }
          echo "MORDANT_THEMES_DIR=${THEMES_DIR}" >> "$GITHUB_ENV"

      - name: Build wheels (CPython 3.12+)
        uses: PyO3/maturin-action@v1
        with:
          container: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          target: ${{ matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-gnu' || '' }}
          args: --release
        env:
          MORDANT_THEMES_DIR: ${{ env.MORDANT_THEMES_DIR }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/
          if-no-files-found: error

  build-tui:
    name: TUI binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch mordant wheel themes
        shell: bash
        run: |
          REV=$(grep -oP 'DEFAULT_REV: &str = "\K[^"]+' crates/kilim-core/build.rs)
          echo "Mordant themes rev: $REV"
          mkdir -p "${RUNNER_TEMP}/mordant-src"
          curl -sSL --fail -o "${RUNNER_TEMP}/mordant.tgz" \
            "https://codeload.github.com/${MORDANT_REPO}/tar.gz/refs/tags/${REV}"
          tar -xzf "${RUNNER_TEMP}/mordant.tgz" -C "${RUNNER_TEMP}/mordant-src"
          THEMES_DIR=$(find "${RUNNER_TEMP}/mordant-src" -type d -path "*mordant-py/mordant/themes" | head -n 1)
          test -n "$THEMES_DIR" || { echo "themes dir not found in tarball"; exit 1; }
          COUNT=$(ls "$THEMES_DIR" | wc -l)
          echo "Fetched $COUNT theme files from ${MORDANT_REPO}@${REV}"
          test "$COUNT" -ge 50 || { echo "suspiciously few themes"; exit 1; }
          echo "MORDANT_THEMES_DIR=${THEMES_DIR}" >> "$GITHUB_ENV"

      - name: Build TUI
        shell: bash
        run: cargo build --release -p kilim-tui
        env:
          MORDANT_THEMES_DIR: ${{ env.MORDANT_THEMES_DIR }}

      - name: Upload binary (unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kilim-tui-${{ matrix.os }}
          path: target/release/kilim
          if-no-files-found: error

      - name: Upload binary (windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kilim-tui-${{ matrix.os }}
          path: target/release/kilim.exe
          if-no-files-found: error

  # ── Tests on every push/PR (themes fetched the same way) ──
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch mordant wheel themes
        shell: bash
        run: |
          REV=$(grep -oP 'DEFAULT_REV: &str = "\K[^"]+' crates/kilim-core/build.rs)
          mkdir -p "${RUNNER_TEMP}/mordant-src"
          curl -sSL --fail -o "${RUNNER_TEMP}/mordant.tgz" \
            "https://codeload.github.com/${MORDANT_REPO}/tar.gz/refs/tags/${REV}"
          tar -xzf "${RUNNER_TEMP}/mordant.tgz" -C "${RUNNER_TEMP}/mordant-src"
          THEMES_DIR=$(find "${RUNNER_TEMP}/mordant-src" -type d -path "*mordant-py/mordant/themes" | head -n 1)
          test -n "$THEMES_DIR" || exit 1
          echo "MORDANT_THEMES_DIR=${THEMES_DIR}" >> "$GITHUB_ENV"

      - name: Rust tests
        shell: bash
        run: |
          cargo test -p kilim-core --features markdown
          cargo test -p kilim-core
          cargo build -p kilim-tui
        env:
          MORDANT_THEMES_DIR: ${{ env.MORDANT_THEMES_DIR }}

  # ── GitHub release (tags only) ──
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-tui, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
