[package]
name = "kilim-tui"
version = "0.2.1"
edition = "2021"
description = "Kilim terminal frontend: ratatui multi-view over kilim-core + stitch-pty"

[[bin]]
name = "kilim"
path = "src/main.rs"

[dependencies]
kilim-core = { path = "../kilim-core", features = ["markdown"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
